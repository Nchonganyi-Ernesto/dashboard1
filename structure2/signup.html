<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ksearch</title>
    
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <!-- Ambient Subtle Background Blur Shapes -->
    <div class="bg-blur-orb orb-1"></div>
    <div class="bg-blur-orb orb-2"></div>
    <div class="bg-blur-orb orb-3"></div>

    <!-- Top Left Brand -->
    <div class="page-header">
        <a href="home.html" class="brand">
            <i class="fa-solid fa-circle-nodes"></i>
            <span>ksearch</span>
        </a>
    </div>

    <!-- Main Sign Up Container -->
    <main class="signup-container">
        <div class="signup-card">
            
            <!-- Card Header -->
            <div class="card-header">
                <h2>Create your account</h2>
                <p>Join ksearch to unlock precision search insights, ad management, and real-time analytics.</p>
            </div>

            <!-- Form -->
            <form class="signup-form" onsubmit="event.preventDefault();">
                
                <!-- Full Name Input -->
                <div class="input-group">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" placeholder="Full Name" required id="nameInput">
                </div>

                <!-- Email Input -->
                <div class="input-group">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" placeholder="Email" required id="emailInput">
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" placeholder="Password" required id="passwordInput">
                    <i class="fa-regular fa-eye-slash toggle-password" id="togglePassword"></i>
                </div>

                <!-- Confirm Password Input -->
                <div class="input-group">
                    <i class="fa-solid fa-shield-halved input-icon"></i>
                    <input type="password" placeholder="Confirm Password" required id="confirmPasswordInput">
                    <i class="fa-regular fa-eye-slash toggle-password" id="toggleConfirmPassword"></i>
                </div>

                <!-- Terms Checkbox -->
                <div class="terms-group">
                    <label class="terms-label">
                        <input type="checkbox" required id="termsCheckbox">
                        <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Create Account</button>
                
                <!-- Footer Redirect Link -->
                <div class="form-footer">
                    <p>Already have an account? <a href="signin.html">Sign In</a></p>
                </div>

            </form>

        </div>
    </main>

</body>
<script src="signup.js"></script>
</html>
