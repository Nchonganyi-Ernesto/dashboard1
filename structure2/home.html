<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Engine UI</title>
    
    <!-- FontAwesome for the icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
    
</head>
<body>
     <!-- Full Width Top Navigation -->
    <nav class="top-nav">
        <div class="brand">
            <i class="fa-solid fa-circle-nodes"></i>
            <span>ksearch</span>
        </div>
        
        <!-- Hamburger Icon -->
        <button class="hamburger" id="hamburgerMenu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Sliding Nav Menu -->
        <div class="auth-menu" id="authDropMenu">
            <div class="nav-links">
                <a href="ads.html" class="nav-link">
                    <i class="fa-solid fa-bullhorn"></i>
                    <span>Apply for Ads</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="app-container">
        
        <!-- Hero Section -->
        <header class="hero">
            <h1>Search with Clarity</h1>
            <p>Access analytical precision and real-time insights powered by AI.</p>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search keywords (e.g. tech, AI, fintech)...">
            <button class="search-btn" id="searchBtn">Search</button>
        </div>

        <!-- Dynamic Search Results Section -->
        <div class="search-results-container" id="searchResults" style="display: none; margin-bottom: 35px;">
            <div class="results-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px;">
                <h2 style="font-size: 11px; font-weight: 600; color: #4338ca; letter-spacing: 1.5px; text-transform: uppercase;">
                    <i class="fa-solid fa-bolt"></i> Sponsored Search Results
                </h2>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span id="resultsCount" style="font-size: 12px; color: #6b7280;"></span>
                    <button id="clearSearchBtn" style="background: none; border: none; color: #ef4444; font-size: 12px; cursor: pointer; font-weight: 500;"><i class="fa-solid fa-xmark"></i> Clear</button>
                </div>
            </div>
            <div class="results-list" id="resultsList" style="display: flex; flex-direction: column; gap: 15px;"></div>
        </div>

        <div id="defaultHomeSections">
            <!-- Section Header -->
            <div class="section-header">
                <h2>Trending Insights</h2>
                <i class="fa-solid fa-arrow-trend-up"></i>
            </div>

            <!-- Insights Grid -->
            <div class="insights-grid" id="trendingGrid">
                <!-- Dynamically rendered top highest paid ads -->
                <div class="card">
                    <div class="card-top">
                        <i class="fa-solid fa-chart-line"></i>
                        <span class="badge-live">Live</span>
                    </div>
                    <h3>Loading top paid ads...</h3>
                </div>
            </div>

            <!-- Recent Searches Feed Section -->
            <div class="card feed-section-card" id="recentSearchesFeed" style="margin-bottom: 30px; padding: 20px;">
                <div class="feed-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div class="feed-icon" style="width: 36px; height: 36px; font-size: 15px; background: #e0e7ff; color: #4338ca; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                        </div>
                        <div>
                            <h3 style="font-size: 15px; color: #1f2937; font-weight: 500;">Recent Searches</h3>
                            <p style="font-size: 12px; color: #6b7280; font-weight: 300;">Your search history</p>
                        </div>
                    </div>
                    <button id="clearHistoryBtn" style="background: none; border: none; color: #ef4444; font-size: 11px; cursor: pointer; font-weight: 500; display: none;">Clear History</button>
                </div>
                <div class="recent-searches-list" id="recentSearchesList" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
                    <span style="font-size: 13px; color: #94a3b8; font-weight: 300;">No recent searches yet.</span>
                </div>
            </div>
        </div>

        <!-- Filter Tags -->
        <div class="tags-container">
            <span class="tag">REPORTS</span>
            <span class="tag">TECH</span>
            <span class="tag">FINANCE</span>
            <span class="tag">DESIGN</span>
        </div>
        
    </div>

    <!-- Firebase SDK & Auth Guard -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth-guard.js"></script>
    <script src="home.js"></script>
</body>
</html>
